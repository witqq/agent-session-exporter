name: Publish npm release asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag, for example v2.1.1
        required: true
        type: string
      sha256:
        description: Accepted SHA-256 of the single GitHub Release asset
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify exact asset and publish with OIDC
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@12.0.2

      - name: Verify and publish the accepted GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA256: ${{ inputs.sha256 }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG}"
          expected_sha256="${INPUT_SHA256}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [[ ! "${expected_sha256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "sha256 must contain exactly 64 lowercase hexadecimal characters" >&2
            exit 1
          fi

          version="${tag#v}"
          asset_name="agent-session-exporter-${version}.tgz"
          release_json="${RUNNER_TEMP}/release.json"
          ref_json="${RUNNER_TEMP}/tag-ref.json"
          tag_json="${RUNNER_TEMP}/annotated-tag.json"
          compare_json="${RUNNER_TEMP}/compare.json"
          tarball="${RUNNER_TEMP}/${asset_name}"
          manifest="${RUNNER_TEMP}/package.json"

          parse_registry_url() {
            node -e '
              const parsed = JSON.parse(process.argv[1]);
              const values = Array.isArray(parsed) ? parsed : [parsed];
              if (values.length !== 1 || typeof values[0] !== "string" || !values[0].startsWith("https://")) throw new Error("registry tarball URL is invalid");
              process.stdout.write(values[0]);
            ' "$1"
          }

          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" > "${ref_json}"
          annotated_tag_sha="$(node -e '
            const fs = require("node:fs");
            const ref = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (ref.object?.type !== "tag" || !/^[0-9a-f]{40}$/.test(ref.object?.sha)) throw new Error("release tag must be annotated");
            process.stdout.write(ref.object.sha);
          ' "${ref_json}")"
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${annotated_tag_sha}" > "${tag_json}"
          tag_commit="$(node -e '
            const fs = require("node:fs");
            const [file, expectedTag] = process.argv.slice(1);
            const tag = JSON.parse(fs.readFileSync(file, "utf8"));
            if (tag.tag !== expectedTag || tag.object?.type !== "commit" || !/^[0-9a-f]{40}$/.test(tag.object?.sha)) throw new Error("annotated tag identity is invalid");
            process.stdout.write(tag.object.sha);
          ' "${tag_json}" "${tag}")"
          gh api "repos/${GITHUB_REPOSITORY}/compare/${tag_commit}...${GITHUB_SHA}" > "${compare_json}"
          node -e '
            const fs = require("node:fs");
            const [file, expectedBase] = process.argv.slice(1);
            const comparison = JSON.parse(fs.readFileSync(file, "utf8"));
            if (!["ahead", "identical"].includes(comparison.status) || comparison.merge_base_commit?.sha !== expectedBase) throw new Error("tag commit is not contained in dispatched main");
          ' "${compare_json}" "${tag_commit}"

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > "${release_json}"
          asset_url="$(
            # The JavaScript template literal is intentionally protected from shell expansion.
            # shellcheck disable=SC2016
            node -e '
              const fs = require("node:fs");
              const [file, expectedName, expectedDigest, expectedTag] = process.argv.slice(1);
              const release = JSON.parse(fs.readFileSync(file, "utf8"));
              if (release.tag_name !== expectedTag || release.draft || release.prerelease) throw new Error("release identity or publication state is invalid");
              if (!Array.isArray(release.assets) || release.assets.length !== 1) throw new Error("release must contain exactly one asset");
              const asset = release.assets[0];
              if (asset.name !== expectedName || asset.state !== "uploaded" || asset.digest !== `sha256:${expectedDigest}` || !Number.isSafeInteger(asset.size) || asset.size <= 0) throw new Error("release asset identity is invalid");
              process.stdout.write(asset.browser_download_url);
            ' "${release_json}" "${asset_name}" "${expected_sha256}" "${tag}"
          )"

          curl --fail --location --proto '=https' --tlsv1.2 --output "${tarball}" "${asset_url}"
          node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const [file, expectedDigest] = process.argv.slice(1);
            const actualDigest = crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
            if (actualDigest !== expectedDigest) throw new Error("downloaded asset SHA-256 is invalid");
          ' "${tarball}" "${expected_sha256}"
          tar -xOf "${tarball}" package/package.json > "${manifest}"
          node -e '
            const fs = require("node:fs");
            const [file, expectedVersion, expectedRepository] = process.argv.slice(1);
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            if (manifest.name !== "agent-session-exporter" || manifest.version !== expectedVersion || manifest.repository?.url !== expectedRepository || manifest.bin?.["session-export"] !== "./session-export.js" || manifest.engines?.node !== ">=24.20.0" || manifest.publishConfig?.access !== "public") throw new Error("packed package identity is invalid");
          ' "${manifest}" "${version}" "git+https://github.com/${GITHUB_REPOSITORY}.git"

          if existing_response="$(npm view "agent-session-exporter@${version}" dist.tarball --json 2>/dev/null)"; then
            registry_url="$(parse_registry_url "${existing_response}")"
            registry_tarball="${RUNNER_TEMP}/registry-preflight.tgz"
            curl --fail --location --proto '=https' --tlsv1.2 --output "${registry_tarball}" "${registry_url}"
            registry_sha256="$(shasum -a 256 "${registry_tarball}" | cut -d ' ' -f 1)"
            test "${registry_sha256}" = "${expected_sha256}"
            echo "agent-session-exporter@${version} already contains the accepted bytes; skipping"
          else
            npm publish --access public "${tarball}"
          fi

          registry_response=""
          for attempt in {1..24}; do
            if registry_response="$(npm view "agent-session-exporter@${version}" dist.tarball --json 2>/dev/null)"; then
              break
            fi
            if [[ "${attempt}" = 24 ]]; then
              echo "agent-session-exporter@${version} did not become visible in the registry" >&2
              exit 1
            fi
            sleep 5
          done
          registry_url="$(parse_registry_url "${registry_response}")"
          registry_tarball="${RUNNER_TEMP}/registry-final.tgz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "${registry_tarball}" "${registry_url}"
          registry_sha256="$(shasum -a 256 "${registry_tarball}" | cut -d ' ' -f 1)"
          test "${registry_sha256}" = "${expected_sha256}"
